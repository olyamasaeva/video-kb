[project]
name = "video-kb"
version = "0.1.0"
description = "Скилл Claude Code: база знаний из видеокурса по автосубтитрам YouTube"
readme = "README.md"
requires-python = ">=3.10"
# Скрипты скилла — только стандартная библиотека, рантайм-зависимостей нет.
dependencies = []

# Инструменты разработчика отдельно от рантайма.
[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff==0.15.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv]
# Пакета нет: скилл ставится симлинком, скрипты зовутся по пути (notes/не-код.md).
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ['contract(id): требование openspec/specs с этим ID (### Requirement: <ID> …)']
